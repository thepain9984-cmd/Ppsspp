name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bypass Keystore Error (Generate Dummy)
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Bypass Google Services Error (Generate Dummy)
        run: echo '{"project_info":{"project_number":"1","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.example"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json

      - name: Generate Wrapper and Build
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace > build_error_log.txt 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CustomControls-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Error Log (If Failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Log
          path: build_error_log.txt
